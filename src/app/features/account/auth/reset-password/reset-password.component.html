<main class="main">
  <section class="auth-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="auth-card">
            <h1>Create a new password</h1>
            <p>Choose a new password for your account.</p>

            <form (ngSubmit)="submit()">
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  [class.is-invalid]="newPassword.length > 0 && !isPasswordValid"
                  [class.is-valid]="newPassword.length > 0 && isPasswordValid"
                  id="newPassword"
                  placeholder="New password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                  [(ngModel)]="newPassword"
                  name="newPassword"
                >
                <label for="newPassword">New password</label>
              </div>

              <div class="password-rules mb-3">
                <p class="password-rules-title">Your password must contain:</p>
                <ul>
                  <li [class.rule-valid]="hasMinLength">At least 8 characters</li>
                  <li [class.rule-valid]="hasUppercase">An uppercase letter</li>
                  <li [class.rule-valid]="hasDigit">A number</li>
                  <li [class.rule-valid]="hasSpecialCharacter">A special character: &#64; # $ % ^ &amp; + =</li>
                </ul>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  [class.is-invalid]="confirmPassword.length > 0 && !passwordsMatch"
                  [class.is-valid]="confirmPassword.length > 0 && passwordsMatch"
                  id="confirmNewPassword"
                  placeholder="Confirm password"
                  required
                  autocomplete="new-password"
                  [(ngModel)]="confirmPassword"
                  name="confirmNewPassword"
                >
                <label for="confirmNewPassword">Confirm password</label>
              </div>

              <div *ngIf="confirmPassword.length > 0 && !passwordsMatch" class="inline-error mb-3">
                Passwords do not match.
              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="loading || !canSubmit">
                <span *ngIf="!loading">Reset password</span>
                <span *ngIf="loading">Processing...</span>
              </button>
            </form>

            <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
            <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
