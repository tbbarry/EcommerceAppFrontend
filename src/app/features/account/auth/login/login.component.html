<main class="main">
  <div class="page-title light-background">
    <div class="container d-lg-flex justify-content-between align-items-center">
      <h1 class="mb-2 mb-lg-0">Login</h1>
      <nav class="breadcrumbs">
        <ol>
          <li><a routerLink="/">Home</a></li>
          <li class="current">Login</li>
        </ol>
      </nav>
    </div>
  </div>

  <section id="login" class="login section">
    <div class="container" data-aos="fade-up" data-aos-delay="100">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="auth-container" data-aos="fade-in" data-aos-delay="200">
            <div class="form-header">
              <h3>Welcome Back</h3>
              <p>Sign in to your account</p>
            </div>

            <form class="auth-form-content" (ngSubmit)="login()">
              <div class="input-group mb-3">
                <span class="input-icon">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Email address"
                  required
                  autocomplete="email"
                  [(ngModel)]="credentials.email"
                  name="loginEmail"
                >
              </div>

              <div class="input-group mb-3">
                <span class="input-icon">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                  [(ngModel)]="credentials.password"
                  name="loginPassword"
                >
              </div>

              <div class="d-flex justify-content-end mb-3">
                <a routerLink="/auth/forgot-password" class="switch-btn">Forgot password?</a>
              </div>

              <button type="submit" class="auth-btn primary-btn mb-3" [disabled]="loading">
                <span *ngIf="!loading">Sign In</span>
                <span *ngIf="loading">Signing In...</span>
                <i class="bi bi-arrow-right"></i>
              </button>

              <div class="divider">
                <span>or</span>
              </div>

              <button type="button" class="auth-btn social-btn mb-3" (click)="loginWithGoogle()">
                <i class="bi bi-google"></i>
                Continue with Google
              </button>

              <div class="switch-form">
                <span>Don't have an account?</span>
                <a routerLink="/auth/register" [queryParams]="{ returnUrl: returnUrl }" class="switch-btn">Create account</a>
              </div>
            </form>

            <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">{{ errorMessage }}</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
