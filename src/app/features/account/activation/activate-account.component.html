<main class="main">
  <section class="activation-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="activation-card text-center">
            <div *ngIf="loading" class="state state-loading">
              <div class="spinner-border text-primary mb-3" role="status" aria-hidden="true"></div>
              <h1>Activation en cours</h1>
              <p>Nous vérifions votre lien d’activation.</p>
            </div>

            <div *ngIf="successMessage" class="state state-success">
              <div class="icon success"><i class="bi bi-check-circle"></i></div>
              <h1>Compte activé</h1>
              <p>{{ successMessage }}</p>
              <a routerLink="/auth/login" class="btn btn-primary mt-3">Aller à la connexion</a>
            </div>

            <div *ngIf="errorMessage" class="state state-error">
              <div class="icon error"><i class="bi bi-exclamation-triangle"></i></div>
              <h1>Activation impossible</h1>
              <p>{{ errorMessage }}</p>
              <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
                <a routerLink="/auth/register" class="btn btn-outline-secondary">Retour à l’inscription</a>
                <a routerLink="/auth/login" class="btn btn-primary">Aller à la connexion</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
