<button type="button" class="review-toggle" (click)="toggle()" [attr.aria-expanded]="open" [disabled]="saving">
  <i class="bi bi-star" aria-hidden="true"></i> {{ open ? 'Close' : 'Write or edit a review' }}
</button>
<div class="editor" *ngIf="open">
  <p *ngIf="loading" role="status">Loading your review…</p>
  <p class="feedback error" *ngIf="error" role="alert">{{ error }} <button *ngIf="loadFailed" type="button" (click)="load()">Try again</button></p>
  <p class="feedback success" *ngIf="success" role="status">{{ success }}</p>
  <p class="feedback" *ngIf="review && !review.visible && !loading && !loadFailed">This review is currently hidden.</p>
  <form *ngIf="!loading && !loadFailed" (ngSubmit)="save()">
    <fieldset>
      <legend>Your rating <span aria-hidden="true">*</span></legend>
      <div class="stars">
        <label *ngFor="let star of stars" [class.selected]="star <= rating">
          <input type="radio" name="rating" [value]="star" [(ngModel)]="rating" [attr.aria-label]="star + ' out of 5'" required>
          <span aria-hidden="true">★</span>
        </label>
      </div>
    </fieldset>
    <label [for]="'review-comment-' + itemId">Your review <span class="optional">(optional)</span></label>
    <textarea [id]="'review-comment-' + itemId" name="comment" [(ngModel)]="comment" maxlength="2000"
      rows="3" placeholder="What did you think of this item?"></textarea>
    <div class="actions">
      <button class="save" type="submit" [disabled]="!rating || saving">Save</button>
      <button class="remove" type="button" *ngIf="review" [disabled]="saving" (click)="remove()">Delete</button>
    </div>
  </form>
</div>
